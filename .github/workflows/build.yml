name: Build zAuctionHouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Paper plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shaded plugin JAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build \
            -Phooks.zelauction=false \
            -Phooks.donutauction=false \
            -Phooks.crazyauctions=false
        # These optional hooks depend on external plugin APIs and are not
        # required to run zAuctionHouse itself.

      - name: Show packaged plugin checksum
        run: |
          ls -lh target/zAuctionHouse*.jar
          sha256sum target/zAuctionHouse*.jar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: zAuctionHouse-plugin
          path: target/zAuctionHouse*.jar
          if-no-files-found: error
          retention-days: 7
